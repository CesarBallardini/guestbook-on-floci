# Alembic, the database's migration tool. From this folder, with DATABASE_URL set:
#
#   uv run --frozen alembic upgrade head                      # bring the database up to date
#   uv run --frozen alembic revision --autogenerate -m "..."  # write a migration from a change
#                                                             # in orm_mapping.py; read it before
#                                                             # committing it
#   uv run --frozen alembic check                             # fail if orm_mapping.py and the
#                                                             # database differ
#
# The database's URL is not written here: migrations/env.py reads it from DATABASE_URL.
# The migrations are named by package, not by path: the same file works from this folder and
# from an installed wheel, where it is guestbook/alembic.ini.
[alembic]
script_location = guestbook.infrastructure.database:migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
