# The checks of every pull request and of main. Each job runs the targets a laptop runs
# (make -C app qa, make lint), so what passes on one passes on the other. Nothing here needs
# the emulator: the integration and e2e tests stay on the laptop.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Every Monday, for the advisories published since the last change: make qa runs pip-audit.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request makes its older run pointless; a run on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The versions a laptop uses. app/tests/unit/test_certificate_floors.py keeps uv's at or
  # above the eMudhra advisory's release.
  UV_VERSION: "0.13.7"
  TERRAFORM_VERSION: "1.17.2"
  TFLINT_VERSION: "v0.66.0"

jobs:
  app:
    name: App (lint, types, architecture, coverage, security, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: app/uv.lock
      # uv installs the Python of app/.python-version.
      - run: make -C app install
      - run: make -C app qa
      - name: The wheel holds what a release needs (no emulator needed)
        working-directory: app
        run: uv run --frozen pytest -m integration tests/integration/test_build.py

  infrastructure:
    name: Infrastructure (Terraform, the network's rules, ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      # No state and no emulator: validate and the mocked "terraform test" need neither.
      - run: terraform -chdir=terraform init -backend=false -input=false
      # fmt, validate, tflint, terraform test, and ansible-lint in the control node's image.
      - run: make lint
