# A pull request's title follows Conventional Commits ("feat: ...", "fix(app): ..."), with a
# subject that starts in lowercase, as the commits here do. Dependabot's titles pass too:
# .github/dependabot.yml gives each one a "build" or "ci" prefix.
name: Pull request title

on:
  pull_request:
    # "edited": checked again when the title changes.
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^[^A-Z].*$
          subjectPatternError: >-
            The subject "{subject}" of the title "{title}" starts with a capital letter;
            start it in lowercase.
