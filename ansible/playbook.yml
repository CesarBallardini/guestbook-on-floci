# Makes a release of the guestbook on the instance and runs it: nginx on port 80, in front of
# gunicorn.
#
#   make build                                      # from the folder above: the wheel, in app/dist/
#   docker compose run --rm ansible                 # after "terraform apply" and "make build"
#   docker compose run --rm ansible -e rollback=true    # run the release before the current one
#
# Build, release, run: the build is made on the laptop. A release is that build installed in a
# folder of its own on the instance, with the config next to it, and nothing in it changes
# afterwards. What runs is the release that the "current" link points at.
#
# The instance is a container without systemd, so supervisord is its process manager: it runs
# nginx and gunicorn in the foreground. The playbook starts supervisord, the one daemon here.
- name: Release and run the guestbook
  hosts: all
  gather_facts: false
  vars:
    minimum_python_version: "3.14.5"
    uv_version: "0.13.7"
    supervisor_version: "4.3.0"
    # What "make build" made: one wheel, and requirements.txt with the locked dependencies.
    build_dir: "{{ playbook_dir }}/../app/dist"
    app_dir: /opt/guestbook
    releases_dir: "{{ app_dir }}/releases"
    # The release that runs. supervisord starts gunicorn through this link.
    current_link: "{{ app_dir }}/current"
    # How many releases stay on the instance to go back to.
    releases_kept: 5
    # "-e rollback=true": make no release, and run the one before the current one.
    rollback: false
    gunicorn_port: 8000
    # How often one address may sign the guestbook (nginx's limit_req): the average rate, and
    # how many posts may come at once before the rate applies. A person never gets near; a
    # script that floods the guestbook is answered 429 until it slows down.
    signing_rate: 2r/s
    signing_burst: 20

  tasks:
    # A new instance reports "running" before its sshd is up, as on EC2.
    - name: Wait until the instance accepts SSH
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Install Python 3.14 and nginx
      ansible.builtin.dnf:
        name:
          - python3.14
          - python3.14-pip
          - nginx
        state: present

    - name: Read the operating system's release
      ansible.builtin.command: cat /etc/system-release
      register: system_release
      changed_when: false

    - name: Read the version of Python 3.14
      ansible.builtin.command: python3.14 -c "import platform; print(platform.python_version())"
      register: python_version
      changed_when: false

    - name: Check that Python is at least {{ minimum_python_version }}
      ansible.builtin.assert:
        that: python_version.stdout is version(minimum_python_version, '>=')
        fail_msg: "Python {{ python_version.stdout }} is older than {{ minimum_python_version }}"
        success_msg: "{{ system_release.stdout }}, Python {{ python_version.stdout }}"

    # For supervisord, the one daemon here. A stopped daemon stays in the process table as a
    # zombie: the instance's first process is not an init and never collects it. So "is it
    # running" asks for a process that isn't one.
    - name: Install the check for a running daemon
      ansible.builtin.copy:
        dest: /usr/local/bin/pid-file-alive
        mode: "0755"
        content: |
          #!/bin/sh
          # pid-file-alive <pid file>: succeeds when the file names a process that still runs.
          pid="$(cat "$1" 2>/dev/null)" && [ -n "$pid" ] && [ -r "/proc/$pid/status" ] &&
            ! grep -q '^State:[[:space:]]*Z' "/proc/$pid/status"

    - name: Install uv
      ansible.builtin.command: python3.14 -m pip install --disable-pip-version-check uv=={{ uv_version }}
      register: uv_install
      changed_when: "'Successfully installed' in uv_install.stdout"

    - name: Install supervisord
      ansible.builtin.command: python3.14 -m pip install --disable-pip-version-check supervisor=={{ supervisor_version }}
      register: supervisor_install
      changed_when: "'Successfully installed' in supervisor_install.stdout"

    # ---- Which release runs now, and which ones are there -----------------------------------

    - name: Create the folder of the releases
      ansible.builtin.file:
        path: "{{ releases_dir }}"
        state: directory
        mode: "0755"

    - name: Read which release is the current one
      ansible.builtin.stat:
        path: "{{ current_link }}"
      register: current_link_stat

    - name: List the releases on the instance
      ansible.builtin.find:
        paths: "{{ releases_dir }}"
        file_type: directory
      register: release_folders

    # A release is named by the moment it was made, in UTC: 20261119T231500Z. The names sort in
    # the order the releases were made.
    - name: Note the current release and the others
      ansible.builtin.set_fact:
        current_release_id: "{{ (current_link_stat.stat.lnk_source | basename) if current_link_stat.stat.exists else '' }}"
        release_ids: "{{ release_folders.files | map(attribute='path') | map('basename') | sort }}"

    # ---- Release: the build and the config, in a new folder ---------------------------------

    - name: Make a release, unless the current one is this build with this config
      when: not (rollback | bool)
      block:
        - name: Find the build
          ansible.builtin.find:
            paths: "{{ build_dir }}"
            patterns: "*.whl"
          delegate_to: localhost
          register: build_wheels

        - name: Check that there is one build
          ansible.builtin.assert:
            that: build_wheels.files | length == 1
            fail_msg: "app/dist/ must hold exactly one wheel: run 'make build' first."
            quiet: true

        - name: Read the checksum of the build's wheel
          ansible.builtin.stat:
            path: "{{ build_wheels.files[0].path }}"
            checksum_algorithm: sha256
          delegate_to: localhost
          register: build_wheel

        - name: Read the checksum of the build's requirements
          ansible.builtin.stat:
            path: "{{ build_dir }}/requirements.txt"
            checksum_algorithm: sha256
          delegate_to: localhost
          register: build_requirements

        - name: Read what the current release was made from
          ansible.builtin.slurp:
            src: "{{ current_link }}/release_key"
          register: current_release_key
          when: current_release_id != ''

        # The key says what a release is made from. The same build with the same config is the
        # same release, so a second run makes none.
        - name: Decide whether a new release is needed
          ansible.builtin.set_fact:
            release_key: "{{ wanted_key }}"
            release_is_new: "{{ current_release_id == '' or (current_release_key.content | b64decode | trim) != wanted_key }}"
            # set_fact fixes the moment: a plain variable would read the clock at every use.
            release_datetime_utc_as_str: "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"
          vars:
            wanted_key: >-
              {{ (build_wheel.stat.checksum ~ build_requirements.stat.checksum
                  ~ lookup('ansible.builtin.template', 'guestbook.env.j2')) | hash('sha256') }}

        - name: Note the release to run
          ansible.builtin.set_fact:
            target_release_id: "{{ release_datetime_utc_as_str if release_is_new else current_release_id }}"

        - name: Make the release
          when: release_is_new
          vars:
            new_release_dir: "{{ releases_dir }}/{{ target_release_id }}"
            wheel_name: "{{ build_wheels.files[0].path | basename }}"
          block:
            - name: Create the release's folder
              ansible.builtin.file:
                path: "{{ new_release_dir }}/build"
                state: directory
                mode: "0755"

            - name: Copy the build
              ansible.builtin.copy:
                src: "{{ item }}"
                dest: "{{ new_release_dir }}/build/"
                mode: "0644"
              loop:
                - "{{ build_wheels.files[0].path }}"
                - "{{ build_dir }}/requirements.txt"
              loop_control:
                label: "{{ item | basename }}"

            - name: Create the release's virtual environment
              ansible.builtin.command: uv venv --python /usr/bin/python3.14 {{ new_release_dir }}/venv
              environment:
                UV_PYTHON_DOWNLOADS: never
              args:
                creates: "{{ new_release_dir }}/venv"

            # The versions and the hashes come from app/uv.lock, through the build's
            # requirements.txt. A package whose hash differs is refused.
            - name: Install the locked dependencies
              ansible.builtin.command: >-
                uv pip install --python {{ new_release_dir }}/venv/bin/python
                --require-hashes --requirement {{ new_release_dir }}/build/requirements.txt
              changed_when: true

            - name: Install the app
              ansible.builtin.command: >-
                uv pip install --python {{ new_release_dir }}/venv/bin/python
                --no-deps {{ new_release_dir }}/build/{{ wheel_name }}
              changed_when: true

            - name: Write the release's config
              ansible.builtin.template:
                src: guestbook.env.j2
                dest: "{{ new_release_dir }}/guestbook.env"
                mode: "0600"

            - name: Write what the release was made from
              ansible.builtin.copy:
                dest: "{{ new_release_dir }}/release_key"
                mode: "0644"
                content: "{{ release_key }}\n"
          rescue:
            - name: Remove the release that could not be made
              ansible.builtin.file:
                path: "{{ new_release_dir }}"
                state: absent

            - name: Stop here
              ansible.builtin.fail:
                msg: "The release could not be made. The current one, '{{ current_release_id }}', still runs."

    # ---- Rollback: the release before the current one ---------------------------------------

    # The database's migrations are not undone: the older release runs on the newer schema,
    # which every migration must allow (expand and contract, docs/guestbook.md).
    - name: Choose the release before the current one
      when: rollback | bool
      block:
        - name: Check that there is a release to go back to
          ansible.builtin.assert:
            that: release_ids | select('lt', current_release_id) | list | length > 0
            fail_msg: "There is no release before the current one, '{{ current_release_id }}'."
            quiet: true

        - name: Note the release to run
          ansible.builtin.set_fact:
            target_release_id: "{{ release_ids | select('lt', current_release_id) | last }}"

    # ---- The database's schema, as the release to run sees it --------------------------------

    # "up-to-date", "behind" (its migrations have not run) or "ahead" (a newer release migrated
    # the database: after a rollback). See schema_version.py.
    - name: Read the state of the database's schema, as the release to run sees it
      ansible.builtin.shell: |
        set -e
        release={{ releases_dir }}/{{ target_release_id }}
        set -a; . "$release/guestbook.env"; set +a
        "$release/venv/bin/python" -m guestbook.infrastructure.database.schema_version
      register: schema_state
      changed_when: false

    # The release would refuse to start on it.
    - name: Check that the release to go back to fits the database's schema
      ansible.builtin.assert:
        that: schema_state.stdout != 'behind'
        fail_msg: >-
          The database's schema is behind release '{{ target_release_id }}': its migrations have
          not run. Deploy instead. '{{ current_release_id }}' still runs.
        quiet: true
      when: rollback | bool

    # Before the switch: the release that is about to run finds its tables. Only a schema
    # behind the release is migrated. One ahead of it is left alone: the release's own
    # migrations do not know its revision, and "upgrade head" would fail.
    - name: Bring the database's tables up to date
      ansible.builtin.shell: |
        set -e
        release={{ releases_dir }}/{{ target_release_id }}
        set -a; . "$release/guestbook.env"; set +a
        alembic_ini="$("$release/venv/bin/python" -c \
          'import guestbook, pathlib; print(pathlib.Path(guestbook.__file__).parent / "alembic.ini")')"
        "$release/venv/bin/alembic" --config "$alembic_ini" upgrade head
      register: database_migration
      changed_when: "'Running upgrade' in database_migration.stderr"
      when: not (rollback | bool) and schema_state.stdout == 'behind'

    # ---- Run --------------------------------------------------------------------------------

    - name: Make the release the current one
      ansible.builtin.file:
        src: "{{ releases_dir }}/{{ target_release_id }}"
        dest: "{{ current_link }}"
        state: link
      notify: Restart the guestbook

    - name: Remove the oldest releases
      ansible.builtin.file:
        path: "{{ releases_dir }}/{{ item }}"
        state: absent
      loop: "{{ ((release_ids + [target_release_id]) | unique | sort)[: -(releases_kept | int)] | difference([target_release_id]) }}"
      when: not (rollback | bool)

    - name: Configure nginx
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: "0644"
        validate: nginx -t -c %s
      notify: Reload nginx

    # A worker dies with its master: see the file.
    - name: Configure gunicorn
      ansible.builtin.copy:
        src: gunicorn.conf.py
        dest: /etc/guestbook-gunicorn.conf.py
        mode: "0644"
      notify: Restart the guestbook

    # The process manager: it runs gunicorn and nginx in the foreground, restarts them when they
    # die and keeps what they write. Neither is a daemon and the app writes no pid file.
    - name: Configure supervisord
      ansible.builtin.template:
        src: supervisord.conf.j2
        dest: /etc/supervisord.conf
        mode: "0644"
      notify: Update supervisord

    - name: Restart or reload what changed, before the tasks that start it
      ansible.builtin.meta: flush_handlers

    # The one daemon the playbook starts itself: on a real instance systemd would, at boot.
    # It starts the guestbook and nginx. The loop waits until it answers supervisorctl.
    - name: Start supervisord unless it is running
      ansible.builtin.shell: |
        if pid-file-alive /run/supervisord.pid; then exit 0; fi
        supervisord --configuration /etc/supervisord.conf || exit 1
        for attempt in $(seq 50); do
          supervisorctl pid > /dev/null 2>&1 && { echo started; exit 0; }
          sleep 0.2
        done
        echo "supervisord did not answer" >&2
        exit 1
      register: supervisord_start
      changed_when: "'started' in supervisord_start.stdout"

    # supervisord gives up on a program that fails to start several times in a row, and leaves
    # alone one that was stopped by hand.
    - name: Start the programs that are not running
      ansible.builtin.shell: |
        state="$(supervisorctl status {{ item }} || true)"
        case "$state" in
          *RUNNING*) ;;
          *STARTING*) ;;
          *) supervisorctl start {{ item }} && echo started ;;
        esac
      loop:
        - guestbook
        - nginx
      register: program_start
      changed_when: "'started' in program_start.stdout"

    - name: Check that the guestbook answers through nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
      register: health
      until: health.status == 200
      retries: 10
      delay: 1

    - name: Say which release runs
      ansible.builtin.debug:
        msg: >-
          Release {{ target_release_id }} runs.
          {{ "The database's schema is ahead of it: a newer release migrated it."
             if schema_state.stdout == 'ahead' else "The database's schema is up to date." }}

  # Each one does nothing while supervisord is not running yet: the task that starts it then
  # starts everything from what is on the instance by then.
  handlers:
    - name: Update supervisord
      ansible.builtin.shell: |
        pid-file-alive /run/supervisord.pid || exit 0
        supervisorctl update
      register: supervisord_update
      changed_when: supervisord_update.stdout != ''

    # supervisord sends SIGTERM, gunicorn lets its workers finish their requests, and the new
    # process runs the release that "current" points at now.
    - name: Restart the guestbook
      ansible.builtin.shell: |
        pid-file-alive /run/supervisord.pid || exit 0
        supervisorctl restart guestbook
      register: guestbook_restart
      changed_when: "'started' in guestbook_restart.stdout"

    - name: Reload nginx
      ansible.builtin.shell: |
        pid-file-alive /run/supervisord.pid || exit 0
        supervisorctl signal HUP nginx
      register: nginx_reload
      changed_when: "'signalled' in nginx_reload.stdout"
